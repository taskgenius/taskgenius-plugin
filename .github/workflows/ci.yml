name: CI

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Only the calendar submodule is needed to build; the docs submodule
            # is not, so avoid `submodules: true` on checkout.
            - name: Checkout calendar submodule
              run: git submodule update --init packages/calendar

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            # Version comes from "packageManager" in package.json. Newer pnpm 10.x
            # releases reject the name-only onlyBuiltDependencies entry for the
            # git-hosted @codemirror/language, so keep CI on the pinned version.
            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install

            - name: Build
              run: pnpm run build

            - name: Run tests
              run: pnpm run test --passWithNoTests
